# Build + déploiement Palantir (contrat Gandalf) — modèle xero_photo_achat.
# Build + Artifact Registry + déploiement Cloud Run en us-east1 dans antigravity prod.
# Install du SDK privé @bleuh-co via secret BuildKit (jamais gravé).
#
# NOTE : le hub appelle Palantir serveur-à-serveur avec `x-palantir-key`
# (PALANTIR_API_KEY) — on utilise --update-env-vars pour NE PAS écraser les
# variables d'environnement existantes du service (PALANTIR_API_KEY, clés CRON…).

substitutions:
  _SERVICE: palantir
  _REGION_DEPLOY: us-east1
  _TAG: latest
  _IMAGE: us-east1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/palantir

  # Defauts = PROD ; le declencheur de chaque environnement les surcharge.
  # Ce qui se deduit du projet qui build l'est via $PROJECT_ID / $PROJECT_NUMBER :
  # _FB_PROJECT_ID decide quelle base Firestore recoit les ecritures.
  _FB_API_KEY: AIzaSyBj17yDs3xOQq8lFYjOfx3TmKTeIPANNXs
  _FB_APP_ID: 1:271227085398:web:dd67b650261fbb28d551f7
  _FB_AUTH_DOMAIN: ${PROJECT_ID}.firebaseapp.com
  _FB_PROJECT_ID: ${PROJECT_ID}
  _FB_SENDER_ID: "${PROJECT_NUMBER}"
  _FB_STORAGE_BUCKET: ${PROJECT_ID}.firebasestorage.app
  _HUB_URL: https://gandalf.chanv.com
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ["GH_PKG_TOKEN"]
    args:
      - -c
      - |
        set -euo pipefail
        trap 'rm -f /workspace/gh_token' EXIT
        printf '%s' "$$GH_PKG_TOKEN" > /workspace/gh_token
        DOCKER_BUILDKIT=1 docker build \
          --secret id=gh_token,src=/workspace/gh_token \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_API_KEY} \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN} \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID} \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FB_STORAGE_BUCKET} \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FB_SENDER_ID} \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${_FB_APP_ID} \
          --build-arg NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS=chanv.com,bleuh.co,lafeuilleverte.ca,maisondherbes.com \
          --build-arg NEXT_PUBLIC_HUB_URL=${_HUB_URL} \
          -t "${_IMAGE}:${_TAG}" .
        rm -f /workspace/gh_token

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${_TAG}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${_TAG}
      - --project=${PROJECT_ID}
      - --region=${_REGION_DEPLOY}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --update-env-vars=PALANTIR_URL=https://palantir.chanv.com

images:
  - "${_IMAGE}:${_TAG}"

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/GITHUB_PACKAGES_TOKEN/versions/latest
      env: GH_PKG_TOKEN

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
